services:
  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST}}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
    environment:
      API_URL: http://api:8000
    ports: !reset []
    expose:
      - "3000"
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgresql://anime:${POSTGRES_PASSWORD}@db:5432/anime
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST},https://${PUBLIC_DOMAIN}
      ACCOUNT_COOKIE_SECURE: "true"
    restart: unless-stopped

  db:
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  redis:
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    profiles: ["https"]

volumes:
  caddy_data:
  caddy_config:

